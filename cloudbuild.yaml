logsBucket: "gs://craffy-build-logs"

options:
  machineType: E2_HIGHCPU_8 # 8 vCPU
  logging: GCS_ONLY

timeout: "1200s" # 20 minutes

substitutions:
  _FLUTTER_IMAGE: "asia-east1-docker.pkg.dev/craffy/private/flutter:3.47.7"

availableSecrets:
  secretManager:
    - versionName: projects/craffy/secrets/photos-keystore/versions/latest
      env: KEYSTORE_B64
    - versionName: projects/craffy/secrets/photos-key-properties/versions/latest
      env: KEY_PROPERTIES

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: Build
    waitFor: ["-"]
    args:
      - "build"
      - "-t"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/photos:$TAG_NAME"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: Push to Container registry
    waitFor: [Build]
    args:
      - "push"
      - "asia-east1-docker.pkg.dev/$PROJECT_ID/private/photos:$TAG_NAME"

  - name: "${_FLUTTER_IMAGE}"
    id: Build APK
    waitFor: ["-"]
    # Writes local.properties and the signing files, runs pub get
    # and builds the release APK; see build-apk in the flutter-build image.
    entrypoint: build-apk
    args: ["mobile"]
    secretEnv: ["KEYSTORE_B64", "KEY_PROPERTIES"]
    env:
      - "GIT_COMMIT=$SHORT_SHA"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Upload APK
    waitFor: [Build APK]
    entrypoint: gcloud
    args:
      - storage
      - cp
      - mobile/build/app/outputs/flutter-apk/app-release.apk
      - gs://alexhokl_public/apk/photos-$TAG_NAME-$SHORT_SHA.apk
